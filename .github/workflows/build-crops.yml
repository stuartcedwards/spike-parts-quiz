name: Build part crops
on:
  push:
    paths:
      - 'crop_parts.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  crop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python crop_parts.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/part-*.jpg
          git diff --cached --quiet || git commit -m "Generate individual verified part crops"
          git push
