<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPIKE Parts Challenge</title>
<style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#eef6ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(160deg,#e8f6ff,#fff7dc)}main{max-width:780px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:900;font-size:clamp(22px,5vw,38px)}.card{background:#fff;border-radius:24px;padding:20px;box-shadow:0 12px 35px #17365d22;margin-top:16px}.progress{height:12px;background:#e8edf3;border-radius:9px;overflow:hidden}.bar{height:100%;background:#42b883}.photo{height:330px;background:#fafafa;border-radius:18px;overflow:hidden;position:relative;margin:16px 0;border:1px solid #edf0f3}.photo img{position:absolute;max-width:none}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{border:0;border-radius:15px;padding:14px;font-size:16px;font-weight:750;cursor:pointer}.answer{background:#edf4ff;min-height:64px}.good{background:#c9f5d9!important}.bad{background:#ffd6d6!important}.next{width:100%;background:#ffd84d;margin-top:14px}.hidden{display:none}.center{text-align:center}.muted{color:#637083}input{width:100%;padding:14px;border:2px solid #d9e4f2;border-radius:14px;font-size:18px}@media(max-width:560px){.answers{grid-template-columns:1fr}.photo{height:280px}.card{padding:15px}}</style></head><body><main>
<div class="top"><div class="brand">⚙️ SPIKE Parts Challenge</div><div><b id="stars">⭐ 0</b> <button onclick="showBoard()">🏆</button></div></div>
<div class="card" id="game"><div class="progress"><div class="bar" id="bar"></div></div><p class="muted" id="counter"></p><h2>What part is this?</h2><div class="photo" id="photo"></div><div class="answers" id="answers"></div><p id="feedback" class="center"></p><button id="next" class="next hidden">Next part →</button></div>
<div class="card center hidden" id="finish"><div style="font-size:70px">🏆</div><h1>Challenge complete!</h1><p id="score"></p><p>Enter your name to save your best score on this device.</p><input id="player" maxlength="20" placeholder="Your name"><button class="next" onclick="saveScore()">Add me to leaderboard</button><button onclick="restart()" style="margin-top:10px;width:100%">Play again</button></div>
<div class="card hidden" id="board"><h1>🏆 Leaderboard</h1><div id="boardRows"></div><button class="next" onclick="closeBoard()">Back to quiz</button></div>
<script>
const P=[["IMG_67CBB269-B9D9-49DE-8E31-ED0DED759A01.jpeg","SPIKE",["SPIKE Prime Hub"]],["IMG_43E29AC4-8568-4375-9E32-F5BAEE735B6F.jpeg","Motors",["Medium Motor","Large Motor"]],["IMG_ABECFE0C-E0C6-47DD-A8E1-D83EE94D58E0.jpeg","Sensors",["Light Sensor","Force Sensor","Distance Sensor"]],["IMG_46DC24D6-47FC-40EA-AD30-AA2D0F6684E3.jpeg","Bricks",["1x6 Technic Brick","2x4 Technic Brick with Vertical Axle Holes","6x4 Technic Frame, Open Center"]],["IMG_82FC1712-359C-472D-B51D-3E772E312E5E.jpeg","Plates",["2x4 Plate w/ 3 Holes","1x5 Plate w/ Rounded Corners, Axle Hole","Technic 3-Blade Rotor w/ Axle Hole"]],["IMG_DEA3278D-DE97-4F87-AC79-C38F9EA64577.jpeg","Beams",["1x1 Beam (Spacer)","1x2 Beam w/ 1-Axle Hole","1x7 Beam","1x9 Beam, Bent (6-4)"]],["IMG_9F9DB632-A67D-41E8-A3D0-E70D2F0BD8AD.jpeg","Thin Beams",["1x3 Beam, Thin","3x3 Liftarm, Thin w/ L-Shape","3x3 Beam, Thin w/ D-Shape","3x5 Triangle Beam, Thin","1x3 Beam, Thin w/ 1-Pin & 1-Axle Hole"]],["IMG_06387A50-B0E8-4362-8C70-959E4647EDCC.jpeg","Frames",["5x7 Frame, Open Center","11x19 Technic Frame (Baseplate)","3x5 Beam, H-Shape","5x11 Frame, H-Shape, Open Center","3x3 Pin Connector Block"]],["IMG_60B81712-E580-473B-9DD6-E4949BB1E35E.jpeg","Panels",["3x11 Panel","5x11 Panel, Tapered","3x7x2 Panel, Curved","3x11x2 Panel, Curved w/ 10-Pin Holes","3x5x3 Panel, Bent"]],["IMG_C7788F51-7153-41D0-AB39-AF85810D494B.jpeg","Fairings",["3x7 Fairing","5x11 Fairing","15x2x7 Mudguard, Trapezoid"]],["IMG_E5533126-DC89-4BF8-B7EB-7A9DFDF8B23C.jpeg","Axles",["2L Axle, Notched","5L Axle","5L Axle w/ Stop","4L Axle w/ Center Stop"]],["IMG_401BA366-0249-422E-8DAE-FF0BF2F2B7DF.jpeg","Connectors",["Smooth Pin & Axle","Friction Pin & Axle","1L Friction Pin and 2L Axle","2L Friction Pin and 1L Axle"]],["IMG_A0E68553-2F4C-427B-8AA5-228561A9BBB7.jpeg","Pins",["½ Pin","Pin, Smooth","Pin, Friction","3L Pin","3L Pin w/ Bush"]],["IMG_2C136707-C845-4869-98C2-18C0819DAAD7.jpeg","Connector Hubs",["Pin Hub, Axle","Pin Hub, 2-Axle 90 Degree","Pin Hub, 1-Pin","Pin Hub, 2-Pins","Angled Connector #4, 135 Degrees"]],["IMG_D639049E-F9F3-4FD5-9967-8553A9F67ACF.jpeg","Other Connectors",["½ Bush","Bush","2L Axle Connector","2L Pin Connector","1x1 90 degree Elbow, Axle Holes"]],["IMG_B32BF3C3-09CE-48F1-9D20-909B5FE3B43D.jpeg","Other Connectors",["2L Axle & Pin Perpendicular","3L Axle & 2-Pin Hole","3L 2-Axle & Center Pin","1-Axle & 3-Pin"]],["IMG_D08EA238-91E2-4C35-B09B-850A9D2BEFB1.jpeg","Other Connectors",["Axle & Axle Connector","2-Axle Connector, Rubber","Toggle Db w/ Axles & Pins","3L H-Shaped Connector w/ 4-Pins","3x3 L-Shaped Connector w/ 4-Pins"]],["IMG_DFDE91E5-F0F2-470C-BD15-00482973F957.jpeg","Gears",["8 Tooth Gear","12 Tooth, Bevel","20 Tooth Dbl. Bevel","2L Worm Gear"]],["IMG_824A9A4F-04BA-4DA7-B6BD-602CAA68D8D8.jpeg","Gear Racks",["11x11 35-Tooth ¼ Gear Ring","1x13 Rack","1x14x2 Rack","1x14x2 Rack Housing"]],["IMG_6FE718BD-85CF-43F6-B2B5-87665FC63152.jpeg","Wheels & Tires",["56mm D. x 34mm Wheel w/ Technic Axle Hole","56mm ID. Tire, ZR (68.8x36mm)","56mm D. x 14mm Wheel w/ Tire, Technic Axle Hole","18mm D. x 14mm Wheel w/ Technic Axle Hole"]],["IMG_651A4E2F-E18A-4123-97D4-09F15FCF6F69.jpeg","Link & Chain",["6L Technic Link","5L Wide Track","Rubber Tread Pin","10 Tooth Large Sprocket","4 Knob Wheel"]],["IMG_0E92943C-45E2-4AB6-B210-4CC090A9B561.jpeg","Other Technic",["5x3 Socket w/ H-Shape","19mm D. Ball","1x3 Tooth w/ Axle Hole","12L Flex Axle","6L Ribbed Hose"]]];
const centers={1:[.50],2:[.34,.68],3:[.23,.50,.77],4:[.18,.39,.61,.82],5:[.14,.32,.50,.68,.86]};
let ALL=[];P.forEach(p=>p[2].forEach((name,j)=>ALL.push({file:p[0],cat:p[1],name,j,n:p[2].length,pool:p[2]})));
let order=[],i=0,points=0,locked=false,startTime=Date.now();const $=x=>document.getElementById(x);const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function choices(q){let a=[q.name],same=shuffle(q.pool.filter(x=>x!==q.name));a.push(...same.slice(0,3));while(a.length<4){let x=ALL[Math.floor(Math.random()*ALL.length)].name;if(!a.includes(x))a.push(x)}return shuffle(a)}
function crop(q){let cx=centers[q.n][q.j],cw=q.n<=2?.34:q.n===3?.27:q.n===4?.22:.19;let x=Math.max(.02,cx-cw/2),y=.56,h=.26; if(q.cat==="SPIKE"){x=.31;cw=.38;y=.49;h=.34} if(q.cat==="Motors"){y=.53;h=.30} if(q.cat==="Sensors"){y=.53;h=.30}
let box=$("photo"),W=box.clientWidth,H=box.clientHeight;let scale=Math.max(W/(cw*1080),H/(h*1440));let iw=1080*scale,ih=1440*scale;box.innerHTML=`<img src="${q.file}" style="width:${iw}px;height:${ih}px;left:${-x*iw}px;top:${-y*ih}px" alt="LEGO part">`}
function start(){order=shuffle(ALL);i=0;points=0;startTime=Date.now();$("stars").textContent="⭐ 0";$("game").classList.remove("hidden");$("finish").classList.add("hidden");$("board").classList.add("hidden");show()}
function show(){locked=false;let q=order[i];$("counter").textContent=`Part ${i+1} of ${order.length} · ${q.cat}`;$("bar").style.width=(i/order.length*100)+"%";crop(q);$("feedback").textContent="";$("next").classList.add("hidden");$("answers").innerHTML="";choices(q).forEach(a=>{let b=document.createElement("button");b.className="answer";b.textContent=a;b.onclick=()=>pick(b,a,q.name);$("answers").appendChild(b)})}
function pick(b,a,c){if(locked)return;locked=true;document.querySelectorAll(".answer").forEach(x=>{if(x.textContent===c)x.classList.add("good")});if(a===c){points++;$("stars").textContent="⭐ "+points;$("feedback").textContent="🎉 Correct!"}else{b.classList.add("bad");$("feedback").textContent="Good try — the green answer is correct."}$("next").classList.remove("hidden")}
$("next").onclick=()=>{if(++i<order.length)show();else done()};function done(){$("game").classList.add("hidden");$("finish").classList.remove("hidden");$("score").textContent=`You got ${points} out of ${order.length} correct!`}
function restart(){start()}function saveScore(){let name=$("player").value.trim();if(!name)return alert("Please enter your name.");let sec=Math.round((Date.now()-startTime)/1000),rows=JSON.parse(localStorage.getItem("spikeLeaderboard")||"[]"),old=rows.find(x=>x.name.toLowerCase()===name.toLowerCase()),e={name,score:points,time:sec};if(!old||points>old.score||(points===old.score&&sec<old.time)){rows=rows.filter(x=>x.name.toLowerCase()!==name.toLowerCase());rows.push(e)}rows.sort((a,b)=>b.score-a.score||a.time-b.time);localStorage.setItem("spikeLeaderboard",JSON.stringify(rows.slice(0,20)));showBoard()}
function showBoard(){$("game").classList.add("hidden");$("finish").classList.add("hidden");$("board").classList.remove("hidden");let r=JSON.parse(localStorage.getItem("spikeLeaderboard")||"[]");$("boardRows").innerHTML=r.length?r.map((x,j)=>`<p style="display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #eee"><b>${j+1}. ${x.name}</b><span>⭐ ${x.score} · ${x.time}s</span></p>`).join(""):"<p>No scores yet.</p>"}
function closeBoard(){start()}window.addEventListener("resize",()=>{if(order[i]&&!$("game").classList.contains("hidden"))crop(order[i])});start();
</script></main></body></html>
